name: ci

on:
  push:
  pull_request:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m py_compile scripts/liis_pipeline.py scripts/public_safety_scan.py scripts/make_interactive_figures.py scripts/build_docs_assets.py
      - name: Public safety scan
        run: python scripts/public_safety_scan.py
      - name: Public artifact tests
        run: python -m unittest discover -s tests
